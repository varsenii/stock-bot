# =============================================================================
# Stock Scanner Configuration
# Edit this file to change scan parameters.  No code changes needed.
# =============================================================================


# --- Universe ----------------------------------------------------------------
# Regions to scan.
# 'eu' expands to all 24 European country codes (at, be, ch, cz, de, dk, ee,
# es, fi, fr, gb, gr, hu, ie, is, it, lt, lv, nl, no, pl, pt, ro, se).
# Individual ISO-2 codes are also accepted (e.g. de, fr, gb).
regions:
  - eu
  - gb
  # - de

# Maximum number of tickers to fetch from the screener per run.
# The screener returns ~12,000 liquid European stocks (with volume + P/E filters).
# Since the drawdown filter is applied locally, we need to page through enough
# tickers to find all candidates. Rule of thumb: at 20% drawdown roughly 1 in 5
# profitable, liquid stocks qualifies — so set this to 5× your desired output.
max_results: 2500


# --- Primary filter ----------------------------------------------------------
# Stocks must be at least this % below their 52-WEEK HIGH (not year-over-year).
# This filter is applied locally using Yahoo's fiftyTwoWeekHighChangePercent field,
# which measures the precise drop from the highest price in the last 52 weeks.
min_drawdown_pct: 20


# --- Additional screener filters ---------------------------------------------
# All filters below are evaluated server-side by Yahoo Finance before any data
# is returned.  Set a value to null to disable that filter entirely.
#
# Available filters and their Yahoo Finance field names are listed in
# scanning/filters.py (FILTER_REGISTRY).
filters:

  # Minimum 3-month average daily volume.
  # Removes illiquid cross-listings, warrants, and structured products.
  min_avg_daily_volume: 1000

  # Maximum P/E ratio (trailing twelve months).
  # Excludes loss-making companies and highly-valued growth stocks.
  # Set to null to include all companies regardless of profitability.
  max_pe_ratio: 20


# --- Screener sort -----------------------------------------------------------
# Controls how Yahoo Finance orders tickers before they are paged.
# This determines which stocks you see when max_results < full catalogue.
#
# Common sort fields:
#   avgdailyvol3m      — 3-month avg daily volume (most liquid first) [default]
#   intradaymarketcap  — market capitalisation
#   intradayprice      — current price
#   percentchange      — today's % price change
sort:
  field: avgdailyvol3m
  ascending: false   # false = highest value first


# --- Output ------------------------------------------------------------------
output_dir: output
